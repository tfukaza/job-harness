[project]
name = "job-harness"
version = "0.1.0"
description = "Human-in-the-loop job application harness"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "typer>=0.12",
    "playwright>=1.45",
    "requests>=2.31",
    "pydantic>=2.14.3",
]

[project.scripts]
hj = "scripts.hj:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
