titles: ["backend", "back-end", "back end", "devops", "harness", "site reliability", "sre"]   # substring match on title; empty = any
exclude_title: ["intern", "director", "manager", "head of"]
locations: ["california", "ca", "san francisco", "bay area", "oakland", "berkeley", "san jose", "palo alto", "mountain view", "sunnyvale", "menlo park", "redwood city", "santa clara", "cupertino", "los angeles", "san diego", "irvine", "santa monica", "sacramento", "new york", "ny", "nyc", "brooklyn"]  # whole-word match; empty = any

# Used by `hj search --yc` (hiring Y Combinator startups; location filter above also applies)
yc:
  min_batch_year: 2022      # skip older batches
  stages: ["early"]         # early | growth; empty = any
  tags: []                  # e.g. ["developer tools", "b2b", "ai"]; empty = any
  exclude_tags: []          # e.g. ["hard tech", "consumer"]
