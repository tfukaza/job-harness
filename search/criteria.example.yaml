titles: ["software engineer", "backend", "full stack", "platform engineer", "infrastructure"]   # substring match on title; empty = any
exclude_title: ["intern", "director", "manager", "head of"]
locations: ["remote", "seattle", "austin", "new york"]  # whole-word match; empty = any

# Seniority comes from the `assess-postings` skill: a cheap-model subagent reads the whole posting (no regex,
# titles are unreliable).
# `levels` is the fallback when a posting states no years. Values: intern, new_grad, junior, mid, senior,
# staff, principal, unclear. Unassessed postings are never hidden.
levels: ["unclear", "mid", "senior", "staff"]

# Experience fit. the `assess-postings` skill records the minimum years each posting requires (`hj level` to fix one by hand).
# Recorded years override the `levels` fallback above. Postings outside [min, max] are hidden from `hj batch`.
# Set `have_years` to your own years of experience (count from main.yaml). Roles asking for fewer than `min` are too junior; more than
# `max` is too big a stretch. Edit freely.
have_years: 4   # compare years, never titles: titles inflate or deflate differently per company
years_required:
  min: 2
  max: 7

# Used by `hj search --yc` (hiring Y Combinator startups; location filter above also applies)
yc:
  min_batch_year: 2022      # skip older batches
  stages: []                # early | growth; empty = any
  tags: []                  # e.g. ["developer tools", "b2b", "ai"]; empty = any
  exclude_tags: []          # e.g. ["hard tech", "consumer"]
