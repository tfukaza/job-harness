# Preset "rails": monochrome greys, Geist + Geist Mono, sentence-case headings, solid side rails,
# full-width heading rules with small circles where lines cross, generous spacing.
# Fonts: `brew install --cask font-geist font-geist-mono` (falls back to Helvetica/Menlo if missing).
# All keys are documented in classic.yaml.
body_font: ["Geist", "Helvetica Neue", "Helvetica", "Arial"]
mono_font: ["Geist Mono", "Menlo", "Courier New"]
mono_for: [contact, dates, skills, tagline]
mono_scale: 0.88
text_color: "#111111"
muted: "#6f6f6f"
accent: "#111111"
display_font: []          # name + headings use the body font
display_bold: false
heading_color: "#6f6f6f"
heading_case: as-is
heading_tracking: 0.04
rule: solid
rule_color: "#cfcfcf"
rule_span: page
rails: true
rail_style: solid
rail_color: "#d2d2d2"
joints: true
joint_radius: 2.5
font_paths: []
spacing: 1.5
